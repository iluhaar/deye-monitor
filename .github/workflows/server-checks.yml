name: Server checks

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-checks.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-checks.yml"

permissions:
  contents: read

concurrency:
  group: server-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
