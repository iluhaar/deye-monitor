[package]
name = "deye-monitor-shared"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rune.workspace = true
rune-kit.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "6"
futures-util = { version = "0.3", features = ["sink"] }
notify-rust = "4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestCredentials", "RequestInit", "Response", "Url", "Window"] }
# Rune keeps a static wgpu instance cache; wasm is single-threaded without atomics.
wgpu = { version = "30", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
