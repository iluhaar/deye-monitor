<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#17191d" />
    <title>Deye Monitor · Read only</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      html, body { margin: 0; width: 100%; min-height: 100%; background: #17191d; }
      body { overflow: hidden; }
      #deye-monitor { display: block; width: 100vw; height: 100dvh; }
      #status { position: fixed; z-index: 2; inset: 18px 18px auto; padding: 12px 16px; border-radius: 10px; background: #24272d; color: #f3f4f6; font: 14px/1.5 system-ui, sans-serif; }
      #status:empty { display: none; }
      @media (max-width: 520px) { #status { inset: 10px 10px auto; } }
    </style>
  </head>
  <body>
    <div id="status" role="status" aria-live="polite">Loading the read-only monitor…</div>
    <canvas id="deye-monitor" aria-label="Deye read-only energy monitor"></canvas>
    <script type="module">
      import init from "./app.js";
      const status = document.querySelector("#status");
      try {
        await init();
        status.textContent = "";
      } catch (error) {
        status.textContent = `Unable to start the monitor: ${String(error)}`;
        console.error(error);
      }
    </script>
  </body>
</html>
